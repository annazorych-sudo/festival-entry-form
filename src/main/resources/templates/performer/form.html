<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">
<head>
    <title>参加者登録</title>
</head>
<body>
<div layout:fragment="content">
    <main class="page">
        <div class="card-box">
            <h2 class="h5 mb-3" th:text="${performer.id == null} ? '新しい参加者を登録' : '参加者を編集'">登録</h2>
            <form th:action="@{/performer/process}" th:object="${performer}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">氏名</label>
                    <input type="text" class="form-control" th:errorclass="is-invalid" th:field="*{name}">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">電話番号</label>
                    <input type="text" inputmode="numeric" class="form-control" th:errorclass="is-invalid" th:field="*{phone}" placeholder="090-1234-5678">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">演目のテーマ</label>
                    <input type="text" class="form-control" th:errorclass="is-invalid" th:field="*{title}">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">出演時間（分）</label>
                    <input type="number" class="form-control" th:errorclass="is-invalid" th:field="*{minutes}">
                    <div class="invalid-feedback" th:errors="*{minutes}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label d-block">機材・衣装の搬入補助が必要ですか？</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{needHelp}" th:value="true" id="helpYes">
                        <label class="form-check-label" for="helpYes">はい</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{needHelp}" th:value="false" id="helpNo">
                        <label class="form-check-label" for="helpNo">いいえ</label>
                    </div>
                    <div class="invalid-feedback d-block" th:errors="*{needHelp}"></div>
                </div>

                <button type="submit" class="btn btn-navy">保存する</button>
                <a th:href="@{/performer/list}" class="btn btn-outline-secondary">キャンセル</a>
            </form>
        </div>
    </main>
</div>
</body>
</html>
